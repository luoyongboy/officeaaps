
name: AAPS CI (Dual Build Final)
on: 
  workflow_dispatch:
    inputs:
      tagName:
        description: '选择 AAPS 版本'
        required: true
        default: '3.4.2.2'
        type: choice
        options:
          - 3.4.2.2
          - 3.2.0.4
      buildVariant:
        description: '选择变体'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug

jobs:
  build:
    name: Build AAPS Mobile & Wear
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch selected tag from upstream
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream refs/tags/${{ github.event.inputs.tagName }}:refs/tags/${{ github.event.inputs.tagName }}
          git checkout refs/tags/${{ github.event.inputs.tagName }}

      - name: Apply Bypass Patches & Fix Syntax Errors
        run: |
          # 1. 修复 Git 检查逻辑（解决 831 个语法错误的核心）
          # 不再删除行，而是将抛出异常替换为打印日志，确保 {} 括号匹配
          find . -name "build.gradle.kts" | xargs sed -i 's/throw GradleException("GIT system is not available.*")/println("⚠️ Git Bypass")/g' || true
          find . -name "build.gradle.kts" | xargs sed -i 's/throw GradleException("There are uncommitted changes.*")/println("⚠️ Commit Bypass")/g' || true
          
          # 2. 强制将检查变量设为 true，从源头封堵报错分支
          find . -name "build.gradle.kts" | xargs sed -i 's/val allCommitted =.*/val allCommitted = true/g' || true
          find . -name "build.gradle.kts" | xargs sed -i 's/val gitAvailable =.*/val gitAvailable = true/g' || true

          # 3. 跳过目标关卡 (Objectives) 方便孩子直接进入闭环状态
          find . -type f -name "*Objective*" | xargs -I {} sed -i 's/return false/return true/g' {} || true
          find . -type f -name "*Objective*" | xargs -I {} sed -i 's/isCompleted() = false/isCompleted() = true/g' {} || true

          # 4. 移除过期限制 (EOL)
          find . -type f \( -name "*.kt" -o -name "*.java" \) | xargs sed -i 's/System.currentTimeMillis() > END_OF_LIFE/false/g' || true
          
          # 5. 伪装 Git 环境
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git commit -m "Final patches for dual build" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Unified Keystore
        run: |
          # 生成唯一的签名文件，确保手机和手表能互相识别
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 36500 \
            -alias key0 -keypass android -storepass android \
            -dname "CN=AAPS, OU=AAPS, O=AAPS, L=Liaoning, S=LN, C=CN"

      - name: Build Both APKs (Mobile & Wear)
        run: |
          chmod +x gradlew
          # 同时执行两个模块的编译
          ./gradlew :app:assemble${{ github.event.inputs.buildVariant }} \
                    :wear:assemble${{ github.event.inputs.buildVariant }} \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="key0" \
            -Pandroid.injected.signing.key.password="android" \
            --no-daemon -x test -x lint

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-Dual-Build-${{ github.event.inputs.tagName }}
          path: |
            **/build/outputs/apk/**/*.apk
