name: AAPS CI (Integrated Version)

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.2'
        type: choice
        options:
          - 3.4.2.2
          - 3.4.2.1
          - 3.2.0.4
          - 3.0.0.2
      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug

jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch selected tag from upstream
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream refs/tags/${{ github.event.inputs.tagName }}:refs/tags/${{ github.event.inputs.tagName }}
          git checkout refs/tags/${{ github.event.inputs.tagName }}
          echo "✅ Checked out tag ${{ github.event.inputs.tagName }}"

      - name: Apply Bypass Patches (Objectives & Expiration)
        run: |
          echo "🛠️ Applying patches to skip objectives and ignore expiration..."
          find . -type f -name "*Objective*" | xargs -I {} sed -i 's/return false/return true/g' {} || true
          find . -type f -name "*Objective*" | xargs -I {} sed -i 's/isCompleted() = false/isCompleted() = true/g' {} || true
          find . -type f \( -name "*.kt" -o -name "*.java" \) | xargs sed -i 's/System.currentTimeMillis() > END_OF_LIFE/false/g' || true
          find . -type f \( -name "*.kt" -o -name "*.java" \) | xargs sed -i 's/System.currentTimeMillis() > expirationDate/false/g' || true
          # 顺便处理俄语 Bug (预防性处理)
          RU_FILE="core/ui/src/main/res/values-ru/strings.xml"
          if [ -f "$RU_FILE" ]; then
            rm "$RU_FILE"
            echo "🗑️ Removed Russian strings file to prevent build error."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Generate Self-Signed Keystore
        run: |
          # 使用默认密码 android，避免 Secrets 缺失导致失败
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 36500 \
            -alias key0 -keypass android -storepass android \
            -dname "CN=AAPS, OU=AAPS, O=AAPS, L=City, S=State, C=CH"

      - name: Build APKs (Phone & Wear)
        run: |
          chmod +x gradlew
          ./gradlew :app:assemble${{ github.event.inputs.buildVariant }} :wear:assemble${{ github.event.inputs.buildVariant }} \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx8g" \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="key0" \
            -Pandroid.injected.signing.key.password="android" \
            -x lint -x test

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: aaps-apks-${{ github.event.inputs.tagName }}
          path: |
            **/build/outputs/apk/**/*.apk
